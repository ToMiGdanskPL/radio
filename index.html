<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radio Internetowe</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1E1E1E;
            color: #E5E5EA;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            padding: 16px;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }
        .radio-panel {
            background: #2D2D30;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .radio-row {
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
        }
        .stations-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            width: 100%;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }
        .btn-station {
            background-color: #3A3A3C;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            flex: 0 0 auto;
            border: 1px solid transparent;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-station.active-station {
            background-color: #30D158;
            color: #000;
            font-weight: bold;
        }
        button {
            background-color: #0A84FF;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-media {
            flex: 1;
        }
        .btn-play-state {
            background-color: #30D158;
            color: #000;
        }
        .btn-stop-state {
            background-color: #FF3B30;
            color: #FFF;
        }
        .app-title {
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: #0A84FF;
            margin-bottom: 8px;
        }
        .version-badge {
            text-align: center;
            font-size: 0.8rem;
            color: #8E8E93;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="radio-panel">
            <div class="app-title">📻 Radio Internetowe</div>
            
            <div class="radio-row">
                <div class="stations-scroll" id="stationsList"></div>
            </div>
            
            <div class="radio-row">
                <button id="btnPrev" class="btn-media" onclick="prevStation()">⏮️ Poprzednia</button>
                <button id="btnPlay" class="btn-media btn-play-state" onclick="togglePlay()">▶ Play</button>
                <button id="btnNext" class="btn-media" onclick="nextStation()">Następna ⏭️</button>
            </div>

            <div class="version-badge">Wersja 1.1.0</div>
        </div>
    </div>

    <audio id="audioPlayer" preload="none"></audio>

<script>
    function generateStationIconSVG(text) {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <rect width="512" height="512" fill="#0A84FF" rx="100"/>
            <circle cx="256" cy="256" r="180" fill="#1E1E1E"/>
            <text x="50%" y="54%" font-family="Arial, sans-serif" font-size="110" font-weight="bold" fill="#30D158" text-anchor="middle" dominant-baseline="middle">${text}</text>
        </svg>`;
        return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
    }

    var STATIONS = [
        { name: "RMF FM", url: "https://rs6-krk2.rmfstream.pl/rmf_fm", logo: generateStationIconSVG("RMF") },
        { name: "Radio ZET", url: "https://zt01.cdn.eurozet.pl/zet-net.mp3", logo: generateStationIconSVG("ZET") },
        { name: "Radio Plus", url: "https://pl05.cdn.eurozet.pl/plu-gdn.mp3", logo: generateStationIconSVG("PLUS") },
        { name: "Radio Gdańsk", url: "https://stream.task.gda.pl:8443/rg1", logo: generateStationIconSVG("RG") },
        { name: "Radio Złote Przeboje", url: "https://radiostream.pl/tuba8906-1.mp3", logo: generateStationIconSVG("RZP") },
        { name: "Muzo FM", url: "https://n12-eu.rcs.revma.com/1nnezw8qz7zuv", logo: generateStationIconSVG("MUZO") },
        { name: "TOK FM", url: "https://radiostream.pl/tuba10-1.mp3", logo: generateStationIconSVG("TOK") },
        { name: "Eska Trójmiasto", url: "https://ic2.smcdn.pl/2110-1.mp3", logo: generateStationIconSVG("ESKA") },
        { name: "Eska GO", url: "https://ic2.smcdn.pl/6200-1.mp3", logo: generateStationIconSVG("GO") },
        { name: "Eska Rock", url: "https://ic2.smcdn.pl/3990-1.aac", logo: generateStationIconSVG("ROCK") },
        { name: "Antyradio", url: "https://an05.cdn.eurozet.pl/ant-waw.mp3", logo: generateStationIconSVG("ANTY") },
        { name: "Radio Pogoda", url: "https://radiostream.pl/tuba145-1.mp3", logo: generateStationIconSVG("POG") },
        { name: "Radio Kaszëbë", url: "https://stream4.nadaje.com:10125/kaszebe128", logo: generateStationIconSVG("KASZ") },
        { name: "Chillout Zone", url: "https://stream-uk1.radioparadise.com/aac-320", logo: generateStationIconSVG("CHILL") },
        { name: "Radio Yanosik", url: "https://n02-eu.rcs.revma.com/7vhveccrnquvv", logo: generateStationIconSVG("YANO") },
        { name: "Radio Yanosik '80", url: "https://n20-eu.rcs.revma.com/uwey4ye0gfcwv", logo: generateStationIconSVG("80s") },
        { name: "Radio Yanosik Love", url: "https://n07-eu.rcs.revma.com/8fqn8rr6ktuvv", logo: generateStationIconSVG("LOVE") },
        { name: "Radio Yanosik Rock", url: "https://n20-eu.rcs.revma.com/whxxccsdp7uvv", logo: generateStationIconSVG("Y-RCK") },
        { name: "Radio Yanosik X-Mas", url: "https://n25-eu.rcs.revma.com/b667d2c0qxcwv", logo: generateStationIconSVG("XMAS") },
        { name: "Radio Yanosik EDM", url: "https://stream.rcs.revma.com/s4exa620qxcwv", logo: generateStationIconSVG("EDM") },
        { name: "RMF Club EDM", url: "https://rs6-krk2.rmfstream.pl/rmf_club", tag: "CLUB", logo: generateStationIconSVG("CLUB") }
    ];

    var currentStationIdx = 0;
    const audio = document.getElementById("audioPlayer");

    function setupMediaSessionHandlers() {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', function() { togglePlay(); });
            navigator.mediaSession.setActionHandler('pause', function() { togglePlay(); });
            
            // Wymuszenie ikon poprzedni / następny utwór zamiast przewijania
            navigator.mediaSession.setActionHandler('previoustrack', function() { prevStation(); });
            navigator.mediaSession.setActionHandler('nexttrack', function() { nextStation(); });
            
            // Jawne wyłączenie przycisków przeskakiwania sekundowego (seek)
            try { navigator.mediaSession.setActionHandler('seekbackward', null); } catch (e) {}
            try { navigator.mediaSession.setActionHandler('seekforward', null); } catch (e) {}
            try { navigator.mediaSession.setActionHandler('seekto', null); } catch (e) {}
        }
    }

    function updateMediaSession() {
        if (!('mediaSession' in navigator)) return;
        const station = STATIONS[currentStationIdx];
        
        navigator.mediaSession.metadata = new MediaMetadata({
            title: station.name,
            artist: "Radio Internetowe",
            album: "Radio na żywo",
            artwork: [
                { src: station.logo, sizes: '512x512', type: 'image/svg+xml' }
            ]
        });
        
        navigator.mediaSession.playbackState = audio.paused ? "paused" : "playing";
    }

    function renderStationButtons() {
        const container = document.getElementById("stationsList");
        container.innerHTML = "";

        STATIONS.forEach((st, idx) => {
            const btn = document.createElement("button");
            const isActive = (idx === currentStationIdx);
            btn.className = "btn-station" + (isActive ? " active-station" : "");
            btn.innerText = st.name;
            btn.onclick = function() { selectAndPlayStation(idx); };
            container.appendChild(btn);
        });

        const activeBtn = container.querySelector('.active-station');
        if (activeBtn) {
            activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
    }

    function selectAndPlayStation(idx) {
        if (idx < 0) idx = STATIONS.length - 1;
        if (idx >= STATIONS.length) idx = 0;
        
        currentStationIdx = idx;
        const btnPlay = document.getElementById("btnPlay");

        try {
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
        } catch (e) {
            console.log("Reset error:", e);
        }

        audio.src = STATIONS[currentStationIdx].url;
        audio.load();

        setupMediaSessionHandlers();

        const playPromise = audio.play();
        if (playPromise !== undefined) {
            playPromise.then(() => {
                btnPlay.innerText = "⏹️ Stop";
                btnPlay.className = "btn-media btn-stop-state";
                updateMediaSession();
                renderStationButtons();
            }).catch(err => {
                console.log("Błąd odtwarzania:", err);
                btnPlay.innerText = "▶ Play";
                btnPlay.className = "btn-media btn-play-state";
                updateMediaSession();
                renderStationButtons();
            });
        }
    }

    function togglePlay() {
        const btn = document.getElementById("btnPlay");

        if (audio.paused) {
            if (!audio.src || audio.src === "" || audio.src === window.location.href) {
                audio.src = STATIONS[currentStationIdx].url;
            }
            audio.load();
            setupMediaSessionHandlers();
            audio.play().then(() => {
                btn.innerText = "⏹️ Stop";
                btn.className = "btn-media btn-stop-state";
                updateMediaSession();
                renderStationButtons();
            }).catch(err => console.log("Błąd:", err));
        } else {
            audio.pause();
            audio.currentTime = 0;
            btn.innerText = "▶ Play";
            btn.className = "btn-media btn-play-state";
            updateMediaSession();
            renderStationButtons();
        }
    }

    function prevStation() {
        let newIdx = currentStationIdx - 1;
        if (newIdx < 0) newIdx = STATIONS.length - 1;
        selectAndPlayStation(newIdx);
    }

    function nextStation() {
        let newIdx = currentStationIdx + 1;
        if (newIdx >= STATIONS.length) newIdx = 0;
        selectAndPlayStation(newIdx);
    }

    renderStationButtons();
</script>
</body>
</html>
