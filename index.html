<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Internetowe</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --active-color: #10b981;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--text-color);
        }

        /* Lista stacji */
        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .station-btn {
            background-color: #334155;
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .station-btn img {
            width: 36px;
            height: 36px;
            border-radius: 6px;
        }

        .station-btn:hover {
            background-color: #475569;
        }

        /* Aktywny przycisk stacji */
        .station-btn.active {
            background-color: var(--active-color);
            color: #ffffff;
            border-color: #059669;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        /* Panel sterowania odtwarzaczem */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            border-top: 1px solid #334155;
            padding-top: 25px;
            margin-bottom: 15px;
        }

        .control-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.2s;
            flex: 1;
        }

        .control-btn:hover {
            background-color: #2563eb;
        }

        #play-pause-btn {
            background-color: #f59e0b;
            flex: 1.2;
        }

        #play-pause-btn:hover {
            background-color: #d97706;
        }

        /* Stopka z wersją */
        .version-footer {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        /* Customowy scrollbar dla listy stacji */
        .stations-grid::-webkit-scrollbar {
            width: 6px;
        }
        .stations-grid::-webkit-scrollbar-thumb {
            background-color: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wybierz stację radiową</h1>

        <!-- Lista przycisków stacji radiowych -->
        <div class="stations-grid" id="stations-container"></div>

        <!-- Odnośnik/Element audio -->
        <audio id="audio-player"></audio>

        <!-- Przyciski nawigacyjne -->
        <div class="controls">
            <button class="control-btn" id="prev-btn">Poprzednia</button>
            <button class="control-btn" id="play-pause-btn">Play</button>
            <button class="control-btn" id="next-btn">Następna</button>
        </div>

        <!-- Informacja o wersji -->
        <div class="version-footer">Wersja 1.0.0</div>
    </div>

    <script>
        // Funkcja generująca ikonki SVG Data URI w locie
        function generateStationIconSVG(text) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
                <rect width="64" height="64" rx="12" fill="#0f172a"/>
                <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="20" font-weight="bold">${text}</text>
            </svg>`;
            return `data:image/svg+xml;base64,${btoa(svg)}`;
        }

        // Lista stacji radiowych
        const stations = [
            { name: "RMF FM", url: "https://rs6-krk2.rmfstream.pl/rmf_fm", logo: generateStationIconSVG("RMF") },
            { name: "Radio ZET", url: "https://zt01.cdn.eurozet.pl/zet-net.mp3", logo: generateStationIconSVG("ZET") },
            { name: "Radio Plus", url: "https://pl05.cdn.eurozet.pl/plu-gdn.mp3", logo: generateStationIconSVG("PLUS") },
            { name: "Radio Gdańsk", url: "https://stream.task.gda.pl:8443/rg1", logo: generateStationIconSVG("RG") },
            { name: "Radio Złote Przeboje", url: "https://radiostream.pl/tuba8906-1.mp3", logo: generateStationIconSVG("RZP") },
            { name: "Muzo FM", url: "https://n12-eu.rcs.revma.com/1nnezw8qz7zuv", logo: generateStationIconSVG("MUZO") },
            { name: "TOK FM", url: "https://radiostream.pl/tuba10-1.mp3", logo: generateStationIconSVG("TOK") },
            { name: "Eska Trójmiasto", url: "https://ic2.smcdn.pl/2110-1.mp3", logo: generateStationIconSVG("ESKA") },
            { name: "Eska GO", url: "https://ic2.smcdn.pl/6200-1.mp3", logo: generateStationIconSVG("GO") },
            { name: "Eska Rock", url: "https://ic2.smcdn.pl/3990-1.aac", logo: generateStationIconSVG("ROCK") },
            { name: "Antyradio", url: "https://an05.cdn.eurozet.pl/ant-waw.mp3", logo: generateStationIconSVG("ANTY") },
            { name: "Radio Pogoda", url: "https://radiostream.pl/tuba145-1.mp3", logo: generateStationIconSVG("POG") },
            { name: "Radio Kaszëbë", url: "https://stream4.nadaje.com:10125/kaszebe128", logo: generateStationIconSVG("KASZ") },
            { name: "Chillout Zone", url: "https://stream-uk1.radioparadise.com/aac-320", logo: generateStationIconSVG("CHILL") },
            { name: "Radio Yanosik", url: "https://n02-eu.rcs.revma.com/7vhveccrnquvv", logo: generateStationIconSVG("YANO") },
            { name: "Radio Yanosik '80", url: "https://n20-eu.rcs.revma.com/uwey4ye0gfcwv", logo: generateStationIconSVG("80s") },
            { name: "Radio Yanosik Love", url: "https://n07-eu.rcs.revma.com/8fqn8rr6ktuvv", logo: generateStationIconSVG("LOVE") },
            { name: "Radio Yanosik Rock", url: "https://n20-eu.rcs.revma.com/whxxccsdp7uvv", logo: generateStationIconSVG("Y-RCK") },
            { name: "Radio Yanosik X-Mas", url: "https://n25-eu.rcs.revma.com/b667d2c0qxcwv", logo: generateStationIconSVG("XMAS") },
            { name: "Radio Yanosik EDM", url: "https://stream.rcs.revma.com/s4exa620qxcwv", logo: generateStationIconSVG("EDM") },
            { name: "RMF Club EDM", url: "https://rs6-krk2.rmfstream.pl/rmf_club", logo: generateStationIconSVG("CLUB") }
        ];

        let currentStationIndex = -1;
        let isPlaying = false;

        const audioPlayer = document.getElementById('audio-player');
        const stationsContainer = document.getElementById('stations-container');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // Generowanie przycisków stacji
        function initStations() {
            stationsContainer.innerHTML = '';
            stations.forEach((station, index) => {
                const btn = document.createElement('button');
                btn.className = 'station-btn';
                
                const img = document.createElement('img');
                img.src = station.logo;
                img.alt = station.name;

                const textSpan = document.createElement('span');
                textSpan.innerText = station.name;

                btn.appendChild(img);
                btn.appendChild(textSpan);

                btn.onclick = () => selectStation(index);
                stationsContainer.appendChild(btn);
            });
        }

        // Wybór stacji radiowej
        function selectStation(index) {
            currentStationIndex = index;
            const station = stations[currentStationIndex];

            audioPlayer.src = station.url;
            audioPlayer.play()
                .then(() => {
                    isPlaying = true;
                    updateUI();
                })
                .catch(error => {
                    console.log("Błąd odtwarzania:", error);
                    isPlaying = false;
                    updateUI();
                });
        }

        // Aktualizacja wyglądu interfejsu
        function updateUI() {
            const buttons = stationsContainer.querySelectorAll('.station-btn');
            buttons.forEach((btn, idx) => {
                if (idx === currentStationIndex) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            playPauseBtn.innerText = isPlaying ? "Pauza" : "Play";
        }

        // Obsługa Play / Pauza
        playPauseBtn.onclick = () => {
            if (currentStationIndex === -1) {
                selectStation(0);
                return;
            }

            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
            } else {
                audioPlayer.play();
                isPlaying = true;
            }
            updateUI();
        };

        // Obsługa przycisku Poprzednia
        prevBtn.onclick = () => {
            if (stations.length === 0) return;
            if (currentStationIndex <= 0) {
                selectStation(stations.length - 1);
            } else {
                selectStation(currentStationIndex - 1);
            }
        };

        // Obsługa przycisku Następna
        nextBtn.onclick = () => {
            if (stations.length === 0) return;
            if (currentStationIndex === -1 || currentStationIndex >= stations.length - 1) {
                selectStation(0);
            } else {
                selectStation(currentStationIndex + 1);
            }
        };

        // Inicjalizacja przy startie
        initStations();
    </script>
</body>
</html>
