<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f97316">

    <title>Radio by ToMi 3.0</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: "#fb923c",
                            500: "#f97316",
                            600: "#ea580c",
                            700: "#c2410c"
                        }
                    }
                }
            }
        };
    </script>

    <script>
        (() => {
            const saved = localStorage.getItem("radio_tomi_theme");

            if (
                saved === "light" ||
                (!saved &&
                    window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: light)").matches)
            ) {
                document.documentElement.classList.remove("dark");
            } else {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        :root {
            --accent: #f97316;
            --accent-hover: #ea580c;

            --bg: #f5f5f7;
            --bg-secondary: #ffffff;
            --card: #ffffff;
            --card-hover: #f3f3f5;

            --border: rgba(0, 0, 0, 0.08);

            --text: #18181b;
            --muted: #71717a;
            --muted-dark: #a1a1aa;

            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .dark {
            --bg: #0b0b0d;
            --bg-secondary: #111114;
            --card: #18181b;
            --card-hover: #202024;

            --border: rgba(255, 255, 255, 0.08);

            --text: #f5f5f5;
            --muted: #a1a1aa;
            --muted-dark: #71717a;

            --shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background:
                radial-gradient(
                    circle at 15% 0%,
                    rgba(249, 115, 22, 0.10),
                    transparent 30%
                ),
                var(--bg);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                Inter,
                Segoe UI,
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            min-height: 100vh;
            padding-bottom: 100px;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================
           HEADER
        ========================= */

        .app-header {
            position: sticky;
            top: 0;
            z-index: 50;

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            background: color-mix(
                in srgb,
                var(--bg-secondary) 82%,
                transparent
            );

            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 14px 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;

            border-radius: 12px;

            display: grid;
            place-items: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    #fb923c
                );

            box-shadow:
                0 8px 22px rgba(249, 115, 22, 0.3);
        }

        .brand-text {
            font-size: 17px;
        }

        .brand-version {
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            margin-left: 3px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-button {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            border: 1px solid var(--border);

            color: var(--text);
            background: var(--card);

            cursor: pointer;

            display: grid;
            place-items: center;

            transition: 0.2s ease;
        }

        .icon-button:hover {
            background: var(--card-hover);
            transform: translateY(-1px);
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 24px;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-wrap {
            position: relative;
            margin-bottom: 26px;
        }

        .search-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);

            color: var(--muted);
        }

        #searchInput {
            width: 100%;

            border: 1px solid var(--border);
            outline: none;

            border-radius: 16px;

            background: var(--card);
            color: var(--text);

            padding: 14px 18px 14px 45px;

            box-shadow: var(--shadow);

            transition: 0.2s ease;
        }

        #searchInput:focus {
            border-color: rgba(249, 115, 22, 0.5);

            box-shadow:
                0 0 0 3px rgba(249, 115, 22, 0.12),
                var(--shadow);
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            display: grid;
            grid-template-columns: 330px minmax(0, 1fr);

            gap: 42px;

            padding: 32px;

            border: 1px solid var(--border);
            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    color-mix(
                        in srgb,
                        var(--card) 96%,
                        var(--accent)
                    ),
                    var(--card)
                );

            box-shadow: var(--shadow);

            margin-bottom: 34px;
        }

        .hero-left {
            width: 100%;
            max-width: 330px;
        }

        .hero-art {
            width: 100%;
            aspect-ratio: 1 / 1;

            border-radius: 25px;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #27272a,
                    #09090b
                );

            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.25);

            position: relative;
        }

        .hero-art canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .hero-live {
            position: absolute;
            top: 16px;
            left: 16px;

            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 7px 11px;

            border-radius: 999px;

            color: white;
            background: rgba(0, 0, 0, 0.5);

            backdrop-filter: blur(10px);

            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.4px;
        }

        .live-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 0 4px rgba(34, 197, 94, 0.15);
        }

        /* =========================
           HERO CONTROLS
        ========================= */

        .hero-actions {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 12px;

            margin-top: 18px;
        }

        .hero-main-controls {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 14px;
        }

        .hero-control-button,
        .hero-play-button {
            border: 1px solid var(--border);

            display: grid;
            place-items: center;

            cursor: pointer;

            color: var(--text);
            background: var(--card);

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease;
        }

        .hero-control-button {
            width: 48px;
            height: 48px;

            border-radius: 50%;
        }

        .hero-control-button:hover {
            background: var(--card-hover);
            transform: scale(1.05);
        }

        .hero-play-button {
            width: 64px;
            height: 64px;

            border-radius: 50%;

            color: white;
            background: var(--accent);
            border-color: var(--accent);

            font-size: 20px;

            box-shadow:
                0 10px 28px rgba(249, 115, 22, 0.35);
        }

        .hero-play-button:hover {
            background: var(--accent-hover);
            transform: scale(1.05);

            box-shadow:
                0 14px 35px rgba(249, 115, 22, 0.45);
        }

        .hero-secondary-controls {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;
        }

        .hero-secondary-button {
            min-height: 42px;

            padding: 0 16px;

            border-radius: 999px;

            border: 1px solid var(--border);

            background: var(--card);
            color: var(--text);

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            cursor: pointer;

            font-size: 13px;
            font-weight: 650;

            transition: 0.2s ease;
        }

        .hero-secondary-button:hover {
            background: var(--card-hover);
            transform: translateY(-1px);
        }

        .hero-secondary-button i {
            color: var(--accent);
        }

        #heroSleepText {
            min-width: 44px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* =========================
           HERO CONTENT
        ========================= */

        .hero-content {
            display: flex;
            flex-direction: column;
            justify-content: center;

            min-width: 0;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 9px;

            color: var(--accent);

            font-size: 12px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 1.2px;

            margin-bottom: 12px;
        }

        .hero h1 {
            margin: 0 0 10px;

            font-size: clamp(36px, 5vw, 70px);
            line-height: 0.98;

            letter-spacing: -3px;
            font-weight: 850;
        }

        .hero-description {
            color: var(--muted);

            font-size: 16px;
            line-height: 1.6;

            max-width: 650px;
        }

        .hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;

            margin-top: 20px;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;

            padding: 7px 11px;

            border-radius: 999px;

            color: var(--muted);

            background: var(--card-hover);
            border: 1px solid var(--border);

            font-size: 12px;
            font-weight: 600;
        }

        /* =========================
           STATIONS
        ========================= */

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 15px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;

            letter-spacing: -0.5px;
        }

        .section-subtitle {
            color: var(--muted);
            font-size: 13px;
        }

        .station-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(180px, 1fr)
                );

            gap: 14px;
        }

        .station-card {
            position: relative;

            overflow: hidden;

            border-radius: 19px;

            background: var(--card);

            border: 1px solid var(--border);

            padding: 12px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .station-card:hover {
            transform: translateY(-3px);
            background: var(--card-hover);

            box-shadow: var(--shadow);
        }

        .station-card.active {
            border-color: rgba(249, 115, 22, 0.65);

            box-shadow:
                0 0 0 1px rgba(249, 115, 22, 0.25),
                0 15px 35px rgba(249, 115, 22, 0.08);
        }

        .station-card-art {
            position: relative;

            width: 100%;
            aspect-ratio: 1 / 1;

            border-radius: 15px;

            overflow: hidden;

            margin-bottom: 11px;
        }

        .station-card-art canvas {
            display: block;

            width: 100%;
            height: 100%;
        }

        .favorite-button {
            position: absolute;

            top: 9px;
            right: 9px;

            width: 34px;
            height: 34px;

            border: 0;

            border-radius: 50%;

            display: grid;
            place-items: center;

            color: white;

            background: rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(8px);

            cursor: pointer;
        }

        .favorite-button.active {
            color: #f97316;
        }

        .station-name {
            font-weight: 750;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .station-genre {
            color: var(--muted);

            font-size: 12px;

            margin-top: 4px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-eq {
            display: flex;
            align-items: end;

            gap: 2px;

            height: 16px;

            margin-top: 10px;

            opacity: 0.7;
        }

        .mini-eq span {
            width: 3px;

            border-radius: 3px;

            background: var(--accent);

            animation: eq 0.9s infinite ease-in-out;
        }

        .mini-eq span:nth-child(1) {
            height: 40%;
            animation-delay: 0s;
        }

        .mini-eq span:nth-child(2) {
            height: 85%;
            animation-delay: 0.15s;
        }

        .mini-eq span:nth-child(3) {
            height: 55%;
            animation-delay: 0.3s;
        }

        .mini-eq span:nth-child(4) {
            height: 100%;
            animation-delay: 0.45s;
        }

        .mini-eq span:nth-child(5) {
            height: 65%;
            animation-delay: 0.6s;
        }

        @keyframes eq {
            0%,
            100% {
                transform: scaleY(0.55);
            }

            50% {
                transform: scaleY(1);
            }
        }

        /* =========================
           VISUALIZER
        ========================= */

        .visualizer-section {
            margin-top: 34px;

            border-radius: 22px;

            border: 1px solid var(--border);

            background: var(--card);

            overflow: hidden;

            box-shadow: var(--shadow);
        }

        .visualizer-header {
            padding: 16px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid var(--border);
        }

        .visualizer-title {
            font-size: 14px;
            font-weight: 750;
        }

        .visualizer-status {
            color: var(--muted);
            font-size: 12px;
        }

        #visualizer {
            width: 100%;
            height: 150px;

            display: block;

            background:
                linear-gradient(
                    to bottom,
                    rgba(249, 115, 22, 0.025),
                    transparent
                );
        }

        /* =========================
           BOTTOM PLAYER
        ========================= */

        .bottom-player {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 100;

            border-top: 1px solid var(--border);

            background:
                color-mix(
                    in srgb,
                    var(--bg-secondary) 88%,
                    transparent
                );

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 -12px 35px rgba(0, 0, 0, 0.08);
        }

        .player-inner {
            max-width: 1400px;

            min-height: 78px;

            margin: 0 auto;

            padding: 10px 24px;

            display: grid;

            grid-template-columns:
                minmax(180px, 1fr)
                auto
                minmax(180px, 1fr);

            align-items: center;

            gap: 20px;
        }

        .now-playing {
            display: flex;
            align-items: center;

            min-width: 0;

            gap: 11px;
        }

        .now-playing-art {
            width: 48px;
            height: 48px;

            flex: 0 0 48px;

            border-radius: 11px;

            overflow: hidden;
        }

        .now-playing-art canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .now-playing-info {
            min-width: 0;
        }

        .now-playing-name {
            font-weight: 750;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing-genre {
            color: var(--muted);

            font-size: 11px;

            margin-top: 2px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-center {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 7px;
        }

        .player-button {
            width: 40px;
            height: 40px;

            border: 0;

            border-radius: 50%;

            display: grid;
            place-items: center;

            color: var(--text);
            background: transparent;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .player-button:hover {
            background: var(--card-hover);
        }

        .player-button.play {
            width: 48px;
            height: 48px;

            color: white;

            background: var(--accent);

            box-shadow:
                0 8px 22px rgba(249, 115, 22, 0.3);
        }

        .player-button.play:hover {
            background: var(--accent-hover);
        }

        .player-right {
            display: flex;
            justify-content: flex-end;
            align-items: center;

            gap: 12px;
        }

        .volume-wrap {
            display: flex;
            align-items: center;

            gap: 8px;

            color: var(--muted);
        }

        #volumeSlider {
            width: 105px;

            accent-color: var(--accent);
        }

        .eq-button {
            height: 38px;

            padding: 0 13px;

            border-radius: 999px;

            border: 1px solid var(--border);

            background: var(--card);
            color: var(--text);

            cursor: pointer;

            font-size: 12px;
            font-weight: 700;
        }

        .eq-button:hover {
            background: var(--card-hover);
        }

        /* =========================
           MODALS
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 200;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0, 0, 0, 0.55);

            backdrop-filter: blur(8px);
        }

        .modal.open {
            display: flex;
        }

        .modal-box {
            width: min(460px, 100%);

            max-height: 90vh;
            overflow-y: auto;

            border-radius: 24px;

            background: var(--bg-secondary);

            border: 1px solid var(--border);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.3);

            padding: 24px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
        }

        .modal-close {
            width: 36px;
            height: 36px;

            border: 0;

            border-radius: 50%;

            color: var(--muted);
            background: var(--card);

            cursor: pointer;
        }

        .sleep-info {
            padding: 16px;

            margin-bottom: 16px;

            border-radius: 15px;

            background: var(--card);

            border: 1px solid var(--border);

            text-align: center;

            color: var(--muted);
        }

        .sleep-info strong {
            display: block;

            margin-top: 5px;

            font-size: 28px;

            color: var(--accent);

            font-variant-numeric: tabular-nums;
        }

        .sleep-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 9px;
        }

        .sleep-option {
            padding: 13px 8px;

            border-radius: 13px;

            border: 1px solid var(--border);

            background: var(--card);

            color: var(--text);

            cursor: pointer;

            font-size: 13px;
            font-weight: 700;
        }

        .sleep-option:hover {
            border-color: rgba(249, 115, 22, 0.5);

            background: var(--card-hover);
        }

        .sleep-option.cancel {
            grid-column: 1 / -1;

            color: var(--accent);
        }

        /* =========================
           EQ
        ========================= */

        .eq-row {
            margin-bottom: 20px;
        }

        .eq-row label {
            display: flex;
            justify-content: space-between;

            margin-bottom: 8px;

            color: var(--muted);

            font-size: 13px;
        }

        .eq-row input {
            width: 100%;

            accent-color: var(--accent);
        }

        /* =========================
           ADD STATION
        ========================= */

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;

            margin-bottom: 6px;

            color: var(--muted);

            font-size: 12px;
            font-weight: 700;
        }

        .form-input {
            width: 100%;

            padding: 12px 14px;

            border-radius: 12px;

            border: 1px solid var(--border);

            outline: none;

            background: var(--card);
            color: var(--text);
        }

        .form-input:focus {
            border-color: rgba(249, 115, 22, 0.6);
        }

        .primary-button {
            width: 100%;

            padding: 13px;

            border: 0;

            border-radius: 13px;

            color: white;

            background: var(--accent);

            cursor: pointer;

            font-weight: 800;
        }

        .primary-button:hover {
            background: var(--accent-hover);
        }

        /* =========================
           TOAST
        ========================= */

        #toast {
            position: fixed;

            left: 50%;
            bottom: 96px;

            z-index: 300;

            transform:
                translate(-50%, 20px);

            opacity: 0;

            pointer-events: none;

            padding: 12px 16px;

            border-radius: 999px;

            color: white;

            background: #18181b;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.25);

            font-size: 13px;
            font-weight: 650;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

        #toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }

        /* =========================
           EMPTY
        ========================= */

        .empty-state {
            padding: 40px 20px;

            text-align: center;

            color: var(--muted);

            border: 1px dashed var(--border);

            border-radius: 18px;
        }

        .empty-state i {
            font-size: 30px;

            color: var(--accent);

            margin-bottom: 10px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 850px) {
            .hero {
                grid-template-columns: 1fr;

                gap: 28px;

                padding: 24px;
            }

            .hero-left {
                max-width: 280px;

                margin: 0 auto;
            }

            .hero-content {
                text-align: center;

                align-items: center;
            }

            .hero h1 {
                letter-spacing: -2px;
            }

            .hero-meta {
                justify-content: center;
            }

let currentStationIndex = 0;

let bassFilter = null;
let midFilter = null;
let trebleFilter = null;

let analyser = null;

let animationFrame = null;

/* ============================================================
   HELPERS
============================================================ */

function getCurrentStation() {
    return allStations[currentStationIndex];
}


function escapeHtml(text) {
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function initials(name) {
    return name
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(word => word[0])
        .join("")
        .toUpperCase();
}


function toast(message) {

    clearTimeout(toastTimer);

    toastElement.textContent = message;

    toastElement.classList.add("show");

    toastTimer = setTimeout(() => {
        toastElement.classList.remove("show");
    }, 2600);
}


/* ============================================================
   CANVAS LOGO
============================================================ */

function generateLogo(canvas, station) {

    if (!canvas || !station) return;

    const size = 700;

    canvas.width = size;
    canvas.height = size;

    const ctx = canvas.getContext("2d");

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            size,
            size
        );

    gradient.addColorStop(
        0,
        station.color || "#f97316"
    );

    gradient.addColorStop(
        1,
        "#18181b"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        size,
        size
    );


    const glow =
        ctx.createRadialGradient(
            size * 0.25,
            size * 0.2,
            10,
            size * 0.25,
            size * 0.2,
            size * 0.65
        );

    glow.addColorStop(
        0,
        "rgba(255,255,255,0.28)"
    );

    glow.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.fillStyle = glow;

    ctx.fillRect(
        0,
        0,
        size,
        size
    );


    ctx.fillStyle =
        "rgba(255,255,255,0.95)";

    ctx.font =
        "900 190px -apple-system, BlinkMacSystemFont, sans-serif";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        initials(station.name),
        size / 2,
        size / 2
    );
}


/* ============================================================
   RENDER STATIONS
============================================================ */

function renderStations() {

    const query =
        searchInput.value
            .trim()
            .toLowerCase();

    const filtered =
        allStations.filter(station =>
            station.name.toLowerCase().includes(query) ||
            station.genre.toLowerCase().includes(query)
        );

    stationCount.textContent =
        `${filtered.length} ${
            filtered.length === 1
                ? "stacja"
                : filtered.length < 5
                    ? "stacje"
                    : "stacji"
        }`;

    if (!filtered.length) {

        stationGrid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
                <i class="fa-solid fa-radio"></i>
                <div>Nie znaleziono stacji.</div>
            </div>
        `;

        return;
    }


    stationGrid.innerHTML =
        filtered.map(station => {

            const originalIndex =
                allStations.findIndex(
                    item => item.id === station.id
                );

            const isFavorite =
                favorites.includes(station.id);

            const isActive =
                originalIndex === currentStationIndex;

            return `
                <article
                    class="station-card ${
                        isActive ? "active" : ""
                    }"
                    data-index="${originalIndex}"
                >

                    <div class="station-card-art">

                        <canvas
                            data-station-id="${escapeHtml(station.id)}"
                        ></canvas>

                        <button
                            class="favorite-button ${
                                isFavorite ? "active" : ""
                            }"
                            data-favorite-id="${escapeHtml(station.id)}"
                            title="${
                                isFavorite
                                    ? "Usuń z ulubionych"
                                    : "Dodaj do ulubionych"
                            }"
                        >
                            <i class="${
                                isFavorite
                                    ? "fa-solid"
                                    : "fa-regular"
                            } fa-heart"></i>
                        </button>

                    </div>

                    <div class="station-name">
                        ${escapeHtml(station.name)}
                    </div>

                    <div class="station-genre">
                        ${escapeHtml(station.genre)}
                    </div>

                    <div class="mini-eq">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </article>
            `;
        }).join("");


    stationGrid
        .querySelectorAll(".station-card")
        .forEach(card => {

            card.addEventListener("click", event => {

                if (
                    event.target.closest(
                        ".favorite-button"
                    )
                ) {
                    return;
                }

                const index =
                    Number(card.dataset.index);

                selectStation(
                    index,
                    true
                );
            });
        });


    stationGrid
        .querySelectorAll(".favorite-button")
        .forEach(button => {

            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    toggleFavorite(
                        button.dataset.favoriteId
                    );
                }
            );
        });


    stationGrid
        .querySelectorAll("canvas")
        .forEach(canvas => {

            const station =
                allStations.find(
                    item =>
                        item.id ===
                        canvas.dataset.stationId
                );

            generateLogo(
                canvas,
                station
            );
        });
}

}


function toggleFavorite(stationId) {

    if (isFavorite(stationId)) {

        favorites =
            favorites.filter(
                id => id !== stationId
            );

        toast(
            "Usunięto z ulubionych"
        );

    } else {

        favorites.push(stationId);

        toast(
            "Dodano do ulubionych"
        );
    }

    saveFavorites();

    updateFavoriteButton();

    renderStations();
}


function updateFavoriteButton() {

    const station =
        getCurrentStation();

    if (!station) return;

    const favorite =
        isFavorite(station.id);

    btnHeroFavorite.innerHTML = `
        <i class="${
            favorite
                ? "fa-solid"
                : "fa-regular"
        } fa-heart"></i>

        <span>
            ${
                favorite
                    ? "Usuń z ulubionych"
                    : "Dodaj do ulubionych"
            }
        </span>
    `;
}


/* ============================================================
   SELECT STATION
============================================================ */

function selectStation(
    index,
    autoplay = false
) {

    if (
        index < 0 ||
        index >= allStations.length
    ) {
        return;
    }

    currentStationIndex = index;

    const station =
        getCurrentStation();

    heroStationName.textContent =
        station.name;

    heroStationGenre.textContent =
        station.genre;

    playerStationName.textContent =
        station.name;

    playerStationGenre.textContent =
        station.genre;

    heroStatus.textContent =
        "Gotowe";


    generateLogo(
        heroCanvas,
        station
    );

    generateLogo(
        playerCanvas,
        station
    );


    audio.src = station.url;

    audio.load();


    updateFavoriteButton();

    updatePlaybackUI();

    renderStations();

    updateMediaSession();


    if (autoplay) {
        playRadio();
    }
}


/* ============================================================
   PLAYBACK
============================================================ */

async function playRadio() {

    try {

        setupAudioContext();

        await audio.play();

        heroStatus.textContent =
            "Odtwarzanie";

        visualizerStatus.textContent =
            "Aktywny";

    } catch (error) {

        console.error(
            "Nie udało się odtworzyć streamu:",
            error
        );

        heroStatus.textContent =
            "Nie można odtworzyć";

        toast(
            "Nie udało się uruchomić tej stacji."
        );
    }

    updatePlaybackUI();
}


function pauseRadio() {

    audio.pause();

    heroStatus.textContent =
        "Wstrzymane";

    visualizerStatus.textContent =
        "Wstrzymany";

    updatePlaybackUI();
}


function togglePlay() {

    if (audio.paused) {
        playRadio();
    } else {
        pauseRadio();
    }
}


function updatePlaybackUI() {

    const playing =
        !audio.paused;

    btnPlay.innerHTML = `
        <i class="fa-solid ${
            playing
                ? "fa-pause"
                : "fa-play"
        }"></i>
    `;

    btnHeroPlay.innerHTML = `
        <i class="fa-solid ${
            playing
                ? "fa-pause"
                : "fa-play"
        }"></i>
    `;

    btnPlay.title =
        playing
            ? "Pauza"
            : "Odtwórz";

    btnHeroPlay.title =
        playing
            ? "Pauza"
            : "Odtwórz";
}


/* ============================================================
   NEXT / PREVIOUS
============================================================ */

function nextStation() {

    currentStationIndex =
        (currentStationIndex + 1) %
        allStations.length;

    selectStation(
        currentStationIndex,
        true
    );
}


function previousStation() {

    currentStationIndex =
        (currentStationIndex - 1 +
            allStations.length) %
        allStations.length;

    selectStation(
        currentStationIndex,
        true
    );
}


/* ============================================================
   VOLUME
============================================================ */

function updateVolume() {

    const volume =
        Number(volumeSlider.value);

    audio.volume =
        volume;

    localStorage.setItem(
        "radio_tomi_volume",
        volume
    );


    if (volume === 0) {

        volumeIcon.className =
            "fa-solid fa-volume-xmark";

    } else if (volume < 0.5) {

        volumeIcon.className =
            "fa-solid fa-volume-low";

    } else {

        volumeIcon.className =
            "fa-solid fa-volume-high";
    }
}


/* ============================================================
   AUDIO CONTEXT + EQ
============================================================ */

function setupAudioContext() {

    if (audioContext) {
        return;
    }

    try {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        sourceNode =
            audioContext.createMediaElementSource(
                audio
            );


        bassFilter =
            audioContext.createBiquadFilter();

        bassFilter.type =
            "lowshelf";

        bassFilter.frequency.value =
            180;


        midFilter =
            audioContext.createBiquadFilter();

        midFilter.type =
            "peaking";

        midFilter.frequency.value =
            1000;

        midFilter.Q.value =
            1;


        trebleFilter =
            audioContext.createBiquadFilter();

        trebleFilter.type =
            "highshelf";

        trebleFilter.frequency.value =
            4000;


        analyser =
            audioContext.createAnalyser();

        analyser.fftSize =
            256;


        sourceNode
            .connect(bassFilter)
            .connect(midFilter)
            .connect(trebleFilter)
            .connect(analyser)
            .connect(
                audioContext.destination
            );


        drawVisualizer();

    } catch (error) {

        console.warn(
            "Web Audio niedostępne:",
            error
        );
    }
}


function setEQ() {

    if (!bassFilter) return;

    const bass =
        Number(
            document.getElementById(
                "bass"
            ).value
        );

    const mid =
        Number(
            document.getElementById(
                "mid"
            ).value
        );

    const treble =
        Number(
            document.getElementById(
                "treble"
            ).value
        );

    bassFilter.gain.value =
        bass;

    midFilter.gain.value =
        mid;

    trebleFilter.gain.value =
        treble;


    document.getElementById(
        "bassValue"
    ).textContent =
        `${bass} dB`;

    document.getElementById(
        "midValue"
    ).textContent =
        `${mid} dB`;

    document.getElementById(
        "trebleValue"
    ).textContent =
        `${treble} dB`;
}


/* ============================================================
   VISUALIZER
============================================================ */

function drawVisualizer() {

    if (!analyser) return;

    const ctx =
        visualizerCanvas.getContext("2d");

    const dpr =
        window.devicePixelRatio || 1;

    const rect =
        visualizerCanvas.getBoundingClientRect();

    visualizerCanvas.width =
        rect.width * dpr;

    visualizerCanvas.height =
        rect.height * dpr;

    ctx.scale(
        dpr,
        dpr
    );


    const bufferLength =
        analyser.frequencyBinCount;

    const dataArray =
        new Uint8Array(
            bufferLength
        );


    function render() {

        animationFrame =
            requestAnimationFrame(
                render
            );

        analyser.getByteFrequencyData(
            dataArray
        );


        const width =
            rect.width;

        const height =
            rect.height;


        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        const bars =
            Math.min(
                80,
                bufferLength
            );

        const barWidth =
            width / bars;


        for (
            let i = 0;
            i < bars;
            i++
        ) {

            const value =
                dataArray[i] / 255;

            const barHeight =
                Math.max(
                    3,
                    value * height * 0.9
                );


            const x =
                i * barWidth;

            const y =
                height - barHeight;


            const gradient =
                ctx.createLinearGradient(
                    0,
                    height,
                    0,
                    0
                );

            gradient.addColorStop(
                0,
                "rgba(249,115,22,0.15)"
            );

            gradient.addColorStop(
                1,
                "rgba(249,115,22,0.95)"
            );

            ctx.fillStyle =
                gradient;

            ctx.fillRect(
                x + 1,
                y,
                Math.max(
                    1,
                    barWidth - 2
                ),
                barHeight
            );
        }
    }


    render();
}

/* ============================================================
   SLEEP TIMER
============================================================ */

function formatTime(milliseconds) {

    const totalSeconds =
        Math.max(
            0,
            Math.ceil(
                milliseconds / 1000
            )
        );

    const minutes =
        Math.floor(
            totalSeconds / 60
        );

    const seconds =
        totalSeconds % 60;

    return `
        ${minutes}:${String(seconds).padStart(2, "0")}
    `;
}


function updateSleepInfo() {

    if (!sleepEnd) {

        heroSleepText.textContent =
            "Timer";

        document.getElementById(
            "sleepInfo"
        ).textContent =
            "Wyłączony";

        btnHeroSleep.title =
            "Timer snu";

        return;
    }


    const remaining =
        Math.max(
            0,
            sleepEnd - Date.now()
        );


    if (remaining <= 0) {

        heroSleepText.textContent =
            "Timer";

        document.getElementById(
            "sleepInfo"
        ).textContent =
            "Wyłączony";

        return;
    }


    const time =
        formatTime(
            remaining
        );

    heroSleepText.textContent =
        time;

    document.getElementById(
        "sleepInfo"
    ).textContent =
        time;

    btnHeroSleep.title =
        `Timer: ${time}`;
}


function setSleepTimer(minutes) {

    clearTimeout(
        sleepTimer
    );

    sleepTimer = null;
    sleepEnd = null;


    if (!minutes) {

        updateSleepInfo();

        toast(
            "Timer snu wyłączony"
        );

        return;
    }


    sleepEnd =
        Date.now() +
        minutes * 60 * 1000;


    sleepTimer =
        setTimeout(
            () => {

                pauseRadio();

                sleepEnd = null;

                updateSleepInfo();

                toast(
                    "Timer zakończony — radio zatrzymane."
                );

            },
            minutes * 60 * 1000
        );


    updateSleepInfo();

    toast(
        `Timer ustawiony na ${minutes} min`
    );
}

                    )

/* ============================================================
   AUDIO EVENTS
============================================================ */

audio.addEventListener(
    "play",
    () => {

        updatePlaybackUI();

        heroStatus.textContent =
            "Odtwarzanie";

        visualizerStatus.textContent =
            "Aktywny";

        if (
            audioContext &&
            audioContext.state ===

        ) {
            audioContext.resume();
        }
    }

audio.addEventListener(
    "pause",
    () => {

        ) {

        }
    }
);


audio.addEventListener(
    "waiting",
    () => {

        heroStatus.textContent =
            "Buforowanie...";
    }
);

    "canplay",
    () => {

        if (!audio.paused) {

            heroStatus.textContent =
                "Odtwarzanie";
        }
    }
);


audio.addEventListener(
    "error",
    () => {

        heroStatus.textContent =
            "Błąd streamu";

        toast(
            "Wystąpił problem ze streamem."
        );

        updatePlaybackUI();
    }
);


/* ============================================================
   MEDIA SESSION
============================================================ */

function updateMediaSession() {

    if (
        !("mediaSession" in navigator)
    ) {
        return;
    }

    const station =
        getCurrentStation();

    if (!station) return;


    navigator.mediaSession.metadata =
        new MediaMetadata({

            title:
                station.name,

            artist:
                "Radio by ToMi",

            album:
                station.genre
        });


    try {

        navigator.mediaSession.setActionHandler(
            "play",
            () => playRadio()
        );

        navigator.mediaSession.setActionHandler(
            "pause",
            () => pauseRadio()
        );

        navigator.mediaSession.setActionHandler(
            "previoustrack",
            previousStation
        );

        navigator.mediaSession.setActionHandler(
            "nexttrack",
            nextStation
        );

    } catch (error) {

        console.warn(
            "Media Session:",
            error
        );
    }
}


/* ============================================================
   KEYBOARD SHORTCUTS
============================================================ */

document.addEventListener(
    "keydown",
    event => {

        const tag =
            document.activeElement?.tagName;

        if (
            tag === "INPUT" ||
            tag === "TEXTAREA"
        ) {
            return;
        }


        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            togglePlay();
        }


        if (
            event.code === "ArrowRight"
        ) {

            nextStation();
        }


        if (
            event.code === "ArrowLeft"
        ) {

            previousStation();
        }


        if (
            event.key.toLowerCase() === "m"
        ) {

            audio.muted =
                !audio.muted;

            volumeIcon.className =
                audio.muted
                    ? "fa-solid fa-volume-xmark"
                    : "fa-solid fa-volume-high";
        }
    }
);


/* ============================================================
   TIMER UPDATE — CO SEKUNDĘ
============================================================ */

setInterval(
    updateSleepInfo,
    1000
);


/* ============================================================
   RESIZE VISUALIZER
============================================================ */

window.addEventListener(
    "resize",
    () => {

        if (analyser) {

            cancelAnimationFrame(
                animationFrame
            );

            drawVisualizer();
        }
    }
);


/* ============================================================
   INIT
============================================================ */

const savedVolume =
    localStorage.getItem(
        "radio_tomi_volume"
    );

if (
    savedVolume !== null
) {

    volumeSlider.value =
        savedVolume;
}

audio.volume =
    Number(
        volumeSlider.value
    );

updateVolume();

updateThemeIcon();

selectStation(
    0,
    false
);

updateSleepInfo();

renderStations();

updatePlaybackUI();

</script>
