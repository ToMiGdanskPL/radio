<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio by ToMi 3.0.1</title>
    <style>
        :root {
            --bg-gradient-dark: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --bg-gradient-light: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --glass-bg-dark: rgba(30, 41, 59, 0.7);
            --glass-bg-light: rgba(255, 255, 255, 0.7);
            --glass-border-dark: rgba(255, 255, 255, 0.1);
            --glass-border-light: rgba(0, 0, 0, 0.1);
            --text-dark: #f8fafc;
            --text-light: #0f172a;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --danger-color: #ef4444;
        }

        [data-theme="dark"] {
            --bg-main: var(--bg-gradient-dark);
            --glass-bg: var(--glass-bg-dark);
            --glass-border: var(--glass-border-dark);
            --text-main: var(--text-dark);
        }

        [data-theme="light"] {
            --bg-main: var(--bg-gradient-light);
            --glass-bg: var(--glass-bg-light);
            --glass-border: var(--glass-border-light);
            --text-main: var(--text-light);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .radio-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            width: 100%;
            max-width: 800px;
            padding: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .version-tag {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .player-display {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 24px;
            align-items: center;
            margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.15);
            padding: 20px;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
        }

        @media (max-width: 600px) {
            .player-display {
                grid-template-columns: 1fr;
                text-align: center;
            }
        }

        .station-logo-wrapper {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 14px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .station-logo-wrapper img, .station-logo-wrapper canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .now-playing {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .station-title {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .stream-meta {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* Wersja 3.0.1 - Dedykowany układ przycisków sterowania */
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        .playback-btns {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            padding: 0;
            justify-content: center;
            font-size: 1.2rem;
        }

        .btn-play-main {
            width: 56px;
            height: 56px;
            font-size: 1.4rem;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 180px;
        }

        .volume-slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .visualizer-container {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            border: 1px solid var(--glass-border);
        }

        canvas#visualizer {
            width: 100%;
            height: 100%;
        }

        .eq-panel {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid var(--glass-border);
        }

        .eq-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .eq-sliders {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .eq-control {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.8rem;
        }

        .stations-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .station-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .station-card {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .station-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .station-card.active {
            border-color: var(--accent-color);
            background: rgba(56, 189, 248, 0.1);
        }

        .station-card-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .input-group input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 10px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="radio-container">
    <!-- Header -->
    <div class="header">
        <h1>Radio by ToMi</h1>
        <div class="header-actions">
            <span class="version-tag">v3.0.1</span>
            <button class="btn" id="themeToggleBtn" title="Przełącz motyw">🌙</button>
            <button class="btn" id="sleepTimerBtn" title="Timer snu">⏱️ <span id="sleepTimerLabel"></span></button>
        </div>
    </div>

    <!-- Main Display -->
    <div class="player-display">
        <div class="station-logo-wrapper" id="logoContainer">
            <!-- Dynamiczny obrazek / SVG canvas -->
        </div>
        <div class="now-playing">
            <div class="station-title" id="currentStationTitle">Wybierz stację</div>
            <div class="stream-meta" id="currentStreamMeta">Gotowy do odtwarzania</div>
        </div>
    </div>

    <!-- Controls Bar v3.0.1 (Zoptymalizowane przyciski) -->
    <div class="controls-bar">
        <div class="playback-btns">
            <button class="btn btn-circle" id="prevBtn" title="Poprzednia stacja (Left Arrow)">⏮️</button>
            <button class="btn btn-primary btn-circle btn-play-main" id="playBtn" title="Odtwarzaj / Pauza (Space)">▶️</button>
            <button class="btn btn-circle" id="nextBtn" title="Następna stacja (Right Arrow)">⏭️</button>
            <button class="btn btn-circle" id="favBtn" title="Dodaj/Usuń z ulubionych">⭐</button>
        </div>

        <div class="volume-container">
            <button class="btn btn-circle" id="muteBtn" title="Wycisz (M)">🔊</button>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
        </div>
    </div>

    <!-- Canvas Visualizer -->
    <div class="visualizer-container">
        <canvas id="visualizer"></canvas>
    </div>

    <!-- Equalizer -->
    <div class="eq-panel">
        <div class="eq-title">
            <span>Korektor dźwięku (EQ)</span>
            <button class="btn" id="resetEqBtn" style="padding: 2px 8px; font-size: 0.75rem;">Reset</button>
        </div>
        <div class="eq-sliders">
            <div class="eq-control">
                <label>Niskie (Bass)</label>
                <input type="range" id="eqLow" min="-12" max="12" value="0" step="1">
            </div>
            <div class="eq-control">
                <label>Średnie (Mid)</label>
                <input type="range" id="eqMid" min="-12" max="12" value="0" step="1">
            </div>
            <div class="eq-control">
                <label>Wysokie (Treble)</label>
                <input type="range" id="eqHigh" min="-12" max="12" value="0" step="1">
            </div>
        </div>
    </div>

    <!-- Station List -->
    <div class="stations-header">
        <h3>Lista Stacji</h3>
        <button class="btn btn-primary" id="addStationBtn">+ Dodaj stację</button>
    </div>
    <div class="station-grid" id="stationGrid"></div>
</div>

<!-- Modal Dodawania Stacji -->
<div class="modal" id="addStationModal">
    <div class="modal-content">
        <h3>Dodaj nową stację</h3>
        <div class="input-group">
            <label for="inputStationName">Nazwa stacji</label>
            <input type="text" id="inputStationName" placeholder="np. Radio Trójka">
        </div>
        <div class="input-group">
            <label for="inputStationUrl">URL strumienia (MP3/AAC)</label>
            <input type="url" id="inputStationUrl" placeholder="https://stream.example.com/live">
        </div>
        <div class="input-group">
            <label for="inputStationLogo">URL Logo (Opcjonalnie)</label>
            <input type="url" id="inputStationLogo" placeholder="https://example.com/logo.png">
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
            <button class="btn" id="cancelAddBtn">Anuluj</button>
            <button class="btn btn-primary" id="saveStationBtn">Zapisz</button>
        </div>
    </div>
</div>

<audio id="audioPlayer" crossorigin="anonymous"></audio>

<script>
    // Domyślne stacje
    const DEFAULT_STATIONS = [
        { id: '1', name: 'RMF FM', url: 'https://rs101-krk.rmftxon.pl/1', logo: '' },
        { id: '2', name: 'Radio ZET', url: 'https://stream.radiozet.pl/zet.mp3', logo: '' },
        { id: '3', name: 'PR3 Trójka', url: 'https://stream.polskieradio.pl/program3/stream.mp3', logo: '' },
        { id: '4', name: 'Radio 357', url: 'https://stream.rcs.revma.com/an1v2pseq1zuv', logo: '' },
        { id: '5', name: 'Radio Nowy Świat', url: 'https://stream.rcs.revma.com/ypqt12und2uvv', logo: '' }
    ];

    // Stan aplikacji
    let stations = JSON.parse(localStorage.getItem('tomi_radio_stations')) || DEFAULT_STATIONS;
    let favorites = JSON.parse(localStorage.getItem('tomi_radio_favs')) || [];
    let currentStationIndex = -1;
    let isPlaying = false;
    let sleepTimerMinutes = null;
    let sleepTimerTimeout = null;

    // Web Audio API Elements
    let audioCtx, audioSource, analyser, eqLowNode, eqMidNode, eqHighNode;
    let audioInitialized = false;

    // Elementy DOM
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const favBtn = document.getElementById('favBtn');
    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const stationGrid = document.getElementById('stationGrid');
    const currentTitle = document.getElementById('currentStationTitle');
    const currentMeta = document.getElementById('currentStreamMeta');
    const logoContainer = document.getElementById('logoContainer');

    // Inicjalizacja Web Audio API
    function initAudioContext() {
        if (audioInitialized) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;

        audioSource = audioCtx.createMediaElementSource(audio);

        // Tworzenie węzłów EQ
        eqLowNode = audioCtx.createBiquadFilter();
        eqLowNode.type = 'lowshelf';
        eqLowNode.frequency.value = 250;

        eqMidNode = audioCtx.createBiquadFilter();
        eqMidNode.type = 'peaking';
        eqMidNode.frequency.value = 1500;
        eqMidNode.Q.value = 1;

        eqHighNode = audioCtx.createBiquadFilter();
        eqHighNode.type = 'highshelf';
        eqHighNode.frequency.value = 4000;

        // Łączenie węzłów
        audioSource.connect(eqLowNode);
        eqLowNode.connect(eqMidNode);
        eqMidNode.connect(eqHighNode);
        eqHighNode.connect(analyser);
        analyser.connect(audioCtx.destination);

        audioInitialized = true;
        startVisualizer();
    }

    // Generator Logo SVG z inicjałami
    function generateLogoSVG(name) {
        const initials = name.split(' ').map(n => n[0]).join('').substring(0, 3).toUpperCase();
        return `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
            <rect width="100" height="100" fill="#1e293b"/>
            <circle cx="50" cy="50" r="40" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
            <text x="50" y="58" font-family="sans-serif" font-weight="bold" font-size="28" fill="#38bdf8" text-anchor="middle">${initials}</text>
        </svg>`;
    }

    function updateLogo(station) {
        logoContainer.innerHTML = '';
        if (station && station.logo) {
            const img = document.createElement('img');
            img.src = station.logo;
            img.onerror = () => { logoContainer.innerHTML = generateLogoSVG(station.name); };
            logoContainer.appendChild(img);
        } else if (station) {
            logoContainer.innerHTML = generateLogoSVG(station.name);
        } else {
            logoContainer.innerHTML = generateLogoSVG('Radio');
        }
    }

    // Renderowanie Listy Stacji
    function renderStations() {
        stationGrid.innerHTML = '';
        stations.forEach((s, idx) => {
            const card = document.createElement('div');
            card.className = `station-card ${idx === currentStationIndex ? 'active' : ''}`;
            
            const initials = s.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            
            card.innerHTML = `
                <div class="station-card-img">${initials}</div>
                <div style="flex:1; overflow:hidden;">
                    <div style="font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${s.name}</div>
                    <div style="font-size:0.75rem; opacity:0.6;">Strumień Audio</div>
                </div>
            `;
            card.onclick = () => selectStation(idx);
            stationGrid.appendChild(card);
        });
    }

    function selectStation(index) {
        if (index < 0 || index >= stations.length) return;
        currentStationIndex = index;
        const station = stations[currentStationIndex];

        audio.src = station.url;
        currentTitle.textContent = station.name;
        currentMeta.textContent = 'Łączenie ze strumieniem...';
        updateLogo(station);
        updateFavBtnState();

        renderStations();
        playAudio();
    }

    function playAudio() {
        initAudioContext();
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        audio.play().then(() => {
            isPlaying = true;
            playBtn.textContent = '⏸️';
            currentMeta.textContent = 'Odtwarzanie na żywo';
            updateMediaSession();
        }).catch(err => {
            console.error(err);
            currentMeta.textContent = 'Błąd odtwarzania strumienia';
            isPlaying = false;
            playBtn.textContent = '▶️';
        });
    }

    function pauseAudio() {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = '▶️';
        currentMeta.textContent = 'Zatrzymane';
    }

    // Obsługa Przycisków v3.0.1
    playBtn.onclick = () => {
        if (currentStationIndex === -1 && stations.length > 0) {
            selectStation(0);
            return;
        }
        isPlaying ? pauseAudio() : playAudio();
    };

    prevBtn.onclick = () => {
        if (stations.length === 0) return;
        let prev = currentStationIndex - 1;
        if (prev < 0) prev = stations.length - 1;
        selectStation(prev);
    };

    nextBtn.onclick = () => {
        if (stations.length === 0) return;
        let next = currentStationIndex + 1;
        if (next >= stations.length) next = 0;
        selectStation(next);
    };

    // Ulubione
    function updateFavBtnState() {
        if (currentStationIndex === -1) return;
        const currentId = stations[currentStationIndex].id;
        favBtn.style.color = favorites.includes(currentId) ? '#f59e0b' : 'inherit';
    }

    favBtn.onclick = () => {
        if (currentStationIndex === -1) return;
        const currentId = stations[currentStationIndex].id;
        const idx = favorites.indexOf(currentId);
        if (idx > -1) {
            favorites.splice(idx, 1);
        } else {
            favorites.push(currentId);
        }
        localStorage.setItem('tomi_radio_favs', JSON.stringify(favorites));
        updateFavBtnState();
    };

    // Głośność i Mute
    volumeSlider.oninput = (e) => {
        audio.volume = e.target.value;
        muteBtn.textContent = audio.volume == 0 ? '🔇' : '🔊';
    };

    muteBtn.onclick = () => {
        audio.muted = !audio.muted;
        muteBtn.textContent = audio.muted ? '🔇' : '🔊';
    };

    // Korektor dźwięku
    document.getElementById('eqLow').oninput = (e) => { if(eqLowNode) eqLowNode.gain.value = e.target.value; };
    document.getElementById('eqMid').oninput = (e) => { if(eqMidNode) eqMidNode.gain.value = e.target.value; };
    document.getElementById('eqHigh').oninput = (e) => { if(eqHighNode) eqHighNode.gain.value = e.target.value; };

    document.getElementById('resetEqBtn').onclick = () => {
        ['eqLow', 'eqMid', 'eqHigh'].forEach(id => {
            document.getElementById(id).value = 0;
        });
        if(eqLowNode) eqLowNode.gain.value = 0;
        if(eqMidNode) eqMidNode.gain.value = 0;
        if(eqHighNode) eqHighNode.gain.value = 0;
    };

    // Wizualizer Canvas
    function startVisualizer() {
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function draw() {
            requestAnimationFrame(draw);
            if (document.hidden) return; // Optymalizacja wydajności gdy karta nieaktywna

            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            analyser.getByteFrequencyData(dataArray);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const barWidth = (canvas.width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                barHeight = (dataArray[i] / 255) * canvas.height;
                ctx.fillStyle = `rgba(56, 189, 248, ${dataArray[i] / 255 + 0.2})`;
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 2;
            }
        }
        draw();
    }

    // Modal dodawania stacji
    const modal = document.getElementById('addStationModal');
    document.getElementById('addStationBtn').onclick = () => modal.classList.add('open');
    document.getElementById('cancelAddBtn').onclick = () => modal.classList.remove('open');

    document.getElementById('saveStationBtn').onclick = () => {
        const name = document.getElementById('inputStationName').value.trim();
        const url = document.getElementById('inputStationUrl').value.trim();
        const logo = document.getElementById('inputStationLogo').value.trim();

        if (name && url) {
            const newStation = { id: Date.now().toString(), name, url, logo };
            stations.push(newStation);
            localStorage.setItem('tomi_radio_stations', JSON.stringify(stations));
            renderStations();
            modal.classList.remove('open');
            document.getElementById('inputStationName').value = '';
            document.getElementById('inputStationUrl').value = '';
            document.getElementById('inputStationLogo').value = '';
        }
    };

    // Motyw (Dark/Light)
    themeToggleBtn.onclick = () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nextTheme);
        themeToggleBtn.textContent = nextTheme === 'dark' ? '🌙' : '☀️';
        localStorage.setItem('tomi_radio_theme', nextTheme);
    };

    // Wczytanie motywu
    const savedTheme = localStorage.getItem('tomi_radio_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeToggleBtn.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

    // Timer Snu
    document.getElementById('sleepTimerBtn').onclick = () => {
        if (sleepTimerTimeout) {
            clearTimeout(sleepTimerTimeout);
            sleepTimerTimeout = null;
            document.getElementById('sleepTimerLabel').textContent = '';
            alert('Timer snu został wyłączony.');
            return;
        }

        const mins = prompt('Za ile minut wyłączyć radio?', '30');
        if (mins && !isNaN(mins) && mins > 0) {
            document.getElementById('sleepTimerLabel').textContent = `(${mins}m)`;
            sleepTimerTimeout = setTimeout(() => {
                pauseAudio();
                document.getElementById('sleepTimerLabel').textContent = '';
                sleepTimerTimeout = null;
            }, mins * 60 * 1000);
        }
    };

    // Skróty klawiaturowe
    window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') {
            e.preventDefault();
            playBtn.click();
        } else if (e.code === 'ArrowLeft') {
            prevBtn.click();
        } else if (e.code === 'ArrowRight') {
            nextBtn.click();
        } else if (e.code === 'KeyM') {
            muteBtn.click();
        }
    });

    // Media Session API
    function updateMediaSession() {
        if ('mediaSession' in navigator && currentStationIndex !== -1) {
            const station = stations[currentStationIndex];
            navigator.mediaSession.metadata = new MediaMetadata({
                title: station.name,
                artist: 'Radio by ToMi 3.0.1',
                album: 'Live Radio'
            });

            navigator.mediaSession.setActionHandler('play', playAudio);
            navigator.mediaSession.setActionHandler('pause', pauseAudio);
            navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
            navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
        }
    }

    // Start
    renderStations();
    updateLogo(null);
</script>

</body>
</html>
