<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Internetowe</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --active-color: #10b981;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--text-color);
        }

        /* Lista stacji */
        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .station-btn {
            background-color: #334155;
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .station-btn img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: contain;
        }

        .station-btn:hover {
            background-color: #475569;
        }

        /* Aktywny przycisk stacji */
        .station-btn.active {
            background-color: var(--active-color);
            color: #ffffff;
            border-color: #059669;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        /* Panel sterowania odtwarzaczem */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            border-top: 1px solid #334155;
            padding-top: 25px;
            margin-bottom: 15px;
        }

        .control-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.2s;
            flex: 1;
        }

        .control-btn:hover {
            background-color: #2563eb;
        }

        #play-pause-btn {
            background-color: #f59e0b;
            flex: 1.2;
        }

        #play-pause-btn:hover {
            background-color: #d97706;
        }

        /* Stopka z wersją */
        .version-footer {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        /* Customowy scrollbar dla listy stacji */
        .stations-grid::-webkit-scrollbar {
            width: 6px;
        }
        .stations-grid::-webkit-scrollbar-thumb {
            background-color: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wybierz stację radiową</h1>

        <!-- Lista przycisków stacji radiowych -->
        <div class="stations-grid" id="stations-container"></div>

        <!-- Odnośnik/Element audio -->
        <audio id="audio-player" crossorigin="anonymous" preload="auto"></audio>

        <!-- Przyciski nawigacyjne -->
        <div class="controls">
            <button class="control-btn" id="prev-btn">Poprzednia</button>
            <button class="control-btn" id="play-pause-btn">Play</button>
            <button class="control-btn" id="next-btn">Następna</button>
        </div>

        <!-- Informacja o wersji -->
        <div class="version-footer">Wersja 1.0.7</div>
    </div>

    <script>
        // Generowanie spójnych ikonek Canvas dla iOS
        function generateStationCanvasIcon(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, 512, 512);

            ctx.fillStyle = '#3b82f6';
            ctx.font = 'bold 110px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 256);

            return canvas.toDataURL('image/png');
        }

        const rawStations = [
            { name: "RMF FM", url: "https://rs6-krk2.rmfstream.pl/rmf_fm", tag: "RMF" },
            { name: "Radio ZET", url: "https://zt01.cdn.eurozet.pl/zet-net.mp3", tag: "ZET" },
            { name: "VOX FM", url: "https://ic2.smcdn.pl/3140-1.mp3", tag: "VOX" },
            { name: "Radio Plus", url: "https://pl05.cdn.eurozet.pl/plu-gdn.mp3", tag: "PLUS" },
            { name: "Radio Gdańsk", url: "https://stream.task.gda.pl:8443/rg1", tag: "RG" },
            { name: "Radio Złote Przeboje", url: "https://radiostream.pl/tuba8906-1.mp3", tag: "RZP" },
            { name: "Muzo FM", url: "https://n12-eu.rcs.revma.com/1nnezw8qz7zuv", tag: "MUZO" },
            { name: "TOK FM", url: "https://radiostream.pl/tuba10-1.mp3", tag: "TOK" },
            { name: "Eska Trójmiasto", url: "https://ic2.smcdn.pl/2110-1.mp3", tag: "ESKA" },
            { name: "Eska GO", url: "https://ic2.smcdn.pl/6200-1.mp3", tag: "GO" },
            { name: "Eska Rock", url: "https://ic2.smcdn.pl/3990-1.aac", tag: "ROCK" },
            { name: "Antyradio", url: "https://an05.cdn.eurozet.pl/ant-waw.mp3", tag: "ANTY" },
            { name: "Radio Pogoda", url: "https://radiostream.pl/tuba145-1.mp3", tag: "POG" },
            { name: "Radio Kaszëbë", url: "https://stream4.nadaje.com:10125/kaszebe128", tag: "KASZ" },
            { name: "Chillout Zone", url: "https://stream-uk1.radioparadise.com/aac-320", tag: "CHILL" },
            { name: "Radio Yanosik", url: "https://n02-eu.rcs.revma.com/7vhveccrnquvv", tag: "YANO" },
            { name: "Radio Yanosik '80", url: "https://n20-eu.rcs.revma.com/uwey4ye0gfcwv", tag: "80s" },
            { name: "Radio Yanosik Love", url: "https://n07-eu.rcs.revma.com/8fqn8rr6ktuvv", tag: "LOVE" },
            { name: "Radio Yanosik Rock", url: "https://n20-eu.rcs.revma.com/whxxccsdp7uvv", tag: "Y-RCK" },
            { name: "Radio Yanosik X-Mas", url: "https://n25-eu.rcs.revma.com/b667d2c0qxcwv", tag: "XMAS" },
            { name: "Radio Yanosik EDM", url: "https://stream.rcs.revma.com/s4exa620qxcwv", tag: "EDM" },
            { name: "RMF Club EDM", url: "https://rs6-krk2.rmfstream.pl/rmf_club", tag: "CLUB" }
        ];

        const stations = rawStations.map(s => ({
            ...s,
            logo: generateStationCanvasIcon(s.tag)
        }));

        let currentStationIndex = -1;
        let isPlaying = false;

        const audioPlayer = document.getElementById('audio-player');
        const stationsContainer = document.getElementById('stations-container');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function initStations() {
            stationsContainer.innerHTML = '';
            stations.forEach((station, index) => {
                const btn = document.createElement('button');
                btn.className = 'station-btn';
                
                const img = document.createElement('img');
                img.src = station.logo;
                img.alt = station.name;

                const textSpan = document.createElement('span');
                textSpan.innerText = station.name;

                btn.appendChild(img);
                btn.appendChild(textSpan);

                btn.onclick = () => selectStation(index);
                stationsContainer.appendChild(btn);
            });
        }

        // Podpięcie sterowania systemowego z dynamicznym przechwytywaniem akcji
        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', () => togglePlayPause());
                navigator.mediaSession.setActionHandler('pause', () => togglePlayPause());
                
                // Przechwytujemy standardowe akcje zmiany utworów
                navigator.mediaSession.setActionHandler('previoustrack', () => playPrevStation());
                navigator.mediaSession.setActionHandler('nexttrack', () => playNextStation());

                // Kluczowe dla iOS: jeśli system pokaże przyciski przeskakiwania (-10 / +10), też przełączą stację
                try { navigator.mediaSession.setActionHandler('seekbackward', () => playPrevStation()); } catch(e){}
                try { navigator.mediaSession.setActionHandler('seekforward', () => playNextStation()); } catch(e){}
            }
        }

        function updateMediaSessionMetadata() {
            if ('mediaSession' in navigator && currentStationIndex !== -1) {
                const station = stations[currentStationIndex];

                navigator.mediaSession.metadata = new MediaMetadata({
                    title: station.name,
                    artist: "Radio Internetowe",
                    album: "Na żywo",
                    artwork: [
                        { src: station.logo, sizes: '512x512', type: 'image/png' }
                    ]
                });
            }
        }

        function selectStation(index) {
            currentStationIndex = index;
            const station = stations[currentStationIndex];

            updateMediaSessionMetadata();
            updateUI();

            // Bezpieczna zmiana źródła bez zgubienia kontekstu odtwarzacza w tle
            audioPlayer.src = station.url;
            audioPlayer.load();

            const playPromise = audioPlayer.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    updateUI();
                }).catch(err => {
                    console.log("Błąd odtwarzania:", err);
                    isPlaying = false;
                    updateUI();
                });
            }
        }

        function updateUI() {
            const buttons = stationsContainer.querySelectorAll('.station-btn');
            buttons.forEach((btn, idx) => {
                if (idx === currentStationIndex) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            playPauseBtn.innerText = isPlaying ? "Pauza" : "Play";
        }

        function togglePlayPause() {
            if (currentStationIndex === -1) {
                selectStation(0);
                return;
            }

            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
            } else {
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    updateUI();
                }).catch(() => {
                    isPlaying = false;
                    updateUI();
                });
            }
            updateUI();
        }

        function playPrevStation() {
            if (stations.length === 0) return;
            let newIndex = currentStationIndex <= 0 ? stations.length - 1 : currentStationIndex - 1;
            selectStation(newIndex);
        }

        function playNextStation() {
            if (stations.length === 0) return;
            let newIndex = (currentStationIndex === -1 || currentStationIndex >= stations.length - 1) ? 0 : currentStationIndex + 1;
            selectStation(newIndex);
        }

        playPauseBtn.onclick = togglePlayPause;
        prevBtn.onclick = playPrevStation;
        nextBtn.onclick = playNextStation;

        initStations();
        setupMediaSession();
    </script>
</body>
</html>
