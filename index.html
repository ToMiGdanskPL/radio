<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Internetowe</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --active-color: #10b981;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .now-playing {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 25px;
            min-height: 1.2em;
        }

        /* Lista stacji */
        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .station-btn {
            background-color: #334155;
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .station-btn:hover {
            background-color: #475569;
        }

        /* Aktywny przycisk stacji */
        .station-btn.active {
            background-color: var(--active-color);
            color: #ffffff;
            border-color: #059669;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        /* Panel sterowania odtwarzaczem */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            border-top: 1px solid #334155;
            padding-top: 25px;
        }

        .control-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.2s;
            flex: 1;
        }

        .control-btn:hover {
            background-color: #2563eb;
        }

        .control-btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #play-pause-btn {
            background-color: #f59e0b;
            flex: 1.2;
        }

        #play-pause-btn:hover {
            background-color: #d97706;
        }

        /* Customowy scrollbar dla listy stacji */
        .stations-grid::-webkit-scrollbar {
            width: 6px;
        }
        .stations-grid::-webkit-scrollbar-thumb {
            background-color: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wybierz stację radiową</h1>
        <div class="now-playing" id="now-playing">Nie wybrano stacji</div>

        <!-- Lista przycisków stacji radiowych -->
        <div class="stations-grid" id="stations-container"></div>

        <!-- Odnośnik/Element audio -->
        <audio id="audio-player"></audio>

        <!-- Przyciski nawigacyjne -->
        <div class="controls">
            <button class="control-btn" id="prev-btn">Poprzednia</button>
            <button class="control-btn" id="play-pause-btn">Play</button>
            <button class="control-btn" id="next-btn">Następna</button>
        </div>
    </div>

    <script>
        // Lista stacji radiowych z bezpośrednimi strumieniami sygnału (MP3/AAC)
        const stations = [
            { name: "RMF FM", url: "https://rs102-krk.rmftxon.pl/RMFFM48" },
            { name: "Radio Zet", url: "https://stream.radiozet.pl/zet.mp3" },
            { name: "Radio Eska", url: "https://ic2.smcdn.pl/2100-1.mp3" },
            { name: "Trójka", url: "https://stream3.polskieradio.pl/pr3/pr3.sdp/playlist.m3u8" },
            { name: "Radio 357", url: "https://stream.radio357.pl/357" },
            { name: "Radio Nowy Świat", url: "https://stream.rcs.revma.com/yp124ed228uvw" }
        ];

        let currentStationIndex = -1;
        let isPlaying = false;

        const audioPlayer = document.getElementById('audio-player');
        const stationsContainer = document.getElementById('stations-container');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const nowPlayingText = document.getElementById('now-playing');

        // Generowanie przycisków stacji
        function initStations() {
            stationsContainer.innerHTML = '';
            stations.forEach((station, index) => {
                const btn = document.createElement('button');
                btn.className = 'station-btn';
                btn.innerText = station.name;
                btn.onclick = () => selectStation(index);
                stationsContainer.appendChild(btn);
            });
        }

        // Wybór stacji radiowej
        function selectStation(index) {
            currentStationIndex = index;
            const station = stations[currentStationIndex];

            audioPlayer.src = station.url;
            audioPlayer.play()
                .then(() => {
                    isPlaying = true;
                    updateUI();
                })
                .catch(error => {
                    console.log("Błąd odtwarzania:", error);
                    isPlaying = false;
                    updateUI();
                });
        }

        // Aktualizacja wyglądu interfejsu (kolory, opisy, przyciski)
        function updateUI() {
            // Zmiana koloru aktywnego przycisku
            const buttons = stationsContainer.querySelectorAll('.station-btn');
            buttons.forEach((btn, idx) => {
                if (idx === currentStationIndex) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Aktualizacja tekstu Play/Pauza i statusu
            if (currentStationIndex !== -1) {
                nowPlayingText.innerText = "Grasz: " + stations[currentStationIndex].name;
                playPauseBtn.innerText = isPlaying ? "Pauza" : "Play";
            } else {
                nowPlayingText.innerText = "Wybierz stację z listy";
                playPauseBtn.innerText = "Play";
            }
        }

        // Obsługa Play / Pauza
        playPauseBtn.onclick = () => {
            if (currentStationIndex === -1) {
                // Jeśli nic nie wybrano, włącz pierwszą stację
                selectStation(0);
                return;
            }

            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
            } else {
                audioPlayer.play();
                isPlaying = true;
            }
            updateUI();
        };

        // Obsługa przycisku Poprzednia
        prevBtn.onclick = () => {
            if (stations.length === 0) return;
            if (currentStationIndex <= 0) {
                selectStation(stations.length - 1);
            } else {
                selectStation(currentStationIndex - 1);
            }
        };

        // Obsługa przycisku Następna
        nextBtn.onclick = () => {
            if (stations.length === 0) return;
            if (currentStationIndex === -1 || currentStationIndex >= stations.length - 1) {
                selectStation(0);
            } else {
                selectStation(currentStationIndex + 1);
            }
        };

        // Inicjalizacja przy startie
        initStations();
    </script>
</body>
</html>
